<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あなたの名前 | Web Games</title>
<meta name="description" content="個人開発のWebゲームをまとめたサイトです。ブラウザですぐ遊べます。">
<meta name="theme-color" content="#f3f4f7">
<meta property="og:title" content="あなたの名前 | Web Games">
<meta property="og:description" content="個人開発のWebゲームをまとめたサイトです。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<style>
/* ============ トークン ============ */
:root{
  --bg:#f3f4f7; --surface:#fff; --surface-2:#e9ebf1; --ink:#14161d; --ink-2:#5b6070; --line:rgba(20,22,29,.1);
  --accent:#3a45f5; --accent-ink:#fff; --glow:rgba(58,69,245,.16);
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1015; --surface:#171a22; --surface-2:#20242e; --ink:#eef0f6; --ink-2:#98a0b3; --line:rgba(255,255,255,.09);
    --accent:#8b94ff; --accent-ink:#0e1015; --glow:rgba(139,148,255,.18); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a22; --surface-2:#20242e; --ink:#eef0f6; --ink-2:#98a0b3; --line:rgba(255,255,255,.09);
  --accent:#8b94ff; --accent-ink:#0e1015; --glow:rgba(139,148,255,.18); color-scheme:dark;
}

/* ============ ベース ============ */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink); line-height:1.75;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
section{padding-block:clamp(56px,9vw,104px)}
h2{font-size:clamp(26px,4vw,40px);line-height:1.25;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--ink-2);margin-top:10px;max-width:34em}

/* 背景のにじみ(カーソルに追従) */
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px circle at var(--ax,70%) var(--ay,10%),var(--glow),transparent 70%);transition:background .3s}

/* ============ ヘッダー ============ */
header{position:sticky;top:max(12px,env(safe-area-inset-top,0px));z-index:20;margin-top:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 20px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);border-radius:999px}
.logo{font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:2px;align-items:center}
nav a,.icon-btn{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
nav a:hover,.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn{width:38px;height:38px;padding:0;display:grid;place-items:center}
@media (max-width:560px){nav a.hide-s{display:none}}

/* ============ ヒーロー ============ */
.hero{padding-top:clamp(56px,10vw,120px);padding-bottom:clamp(40px,6vw,72px)}
.hero h1{font-size:clamp(40px,9.2vw,104px);line-height:1.08;letter-spacing:-.045em;font-weight:900;max-width:11em}
.hero h1 span{display:block;overflow:hidden}
.hero h1 span i{display:block;font-style:normal;transform:translateY(105%);animation:rise .9s var(--ease) forwards}
.hero h1 span:nth-child(2) i{animation-delay:.12s}
.hero h1 span:nth-child(3) i{animation-delay:.24s;color:var(--ink-2)}
@keyframes rise{to{transform:none}}
.hero p{margin-top:28px;color:var(--ink-2);max-width:30em;font-size:clamp(15px,1.8vw,18px);opacity:0;animation:fade .8s .5s forwards}
.hero .cta{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;opacity:0;animation:fade .8s .65s forwards}
@keyframes fade{to{opacity:1}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;font-weight:700;font-size:15px;
  transition:transform .25s var(--ease),box-shadow .25s,background .2s}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 30px -10px var(--accent)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}

/* ============ ゲームカード ============ */
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:32px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:all .2s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .35s var(--ease),box-shadow .35s;will-change:transform}
.card:hover{box-shadow:0 30px 60px -28px rgba(20,22,40,.35)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 70%)}
.card:hover::after{opacity:1}
.thumb{aspect-ratio:16/10;position:relative;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 50) 80% 48%))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card:hover .thumb img{transform:scale(1.05)}
.thumb b{font-size:72px;font-weight:900;color:rgba(255,255,255,.9);letter-spacing:-.05em;mix-blend-mode:soft-light}
.badge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.85);color:#14161d;backdrop-filter:blur(6px)}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.title-row{display:flex;gap:12px;align-items:center}
.icon{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:22px;overflow:hidden;
  background:hsl(var(--h) 80% 92%);border:1px solid var(--line)}
.icon img{width:100%;height:100%;object-fit:contain;padding:6px}
.body h3{font-size:19px;line-height:1.3;letter-spacing:-.01em}
.body p{color:var(--ink-2);font-size:14px;line-height:1.7}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.tags span{font-size:12px;color:var(--ink-2);background:var(--surface-2);padding:3px 10px;border-radius:999px}
.card[hidden]{display:none}
.empty{padding:48px 0;text-align:center;color:var(--ink-2)}
.soon{display:grid;place-items:center;text-align:center;min-height:260px;border:2px dashed var(--line);border-radius:var(--r-lg);color:var(--ink-2);padding:24px;font-size:14px}

/* ============ ダイアログ ============ */
dialog{margin:auto;width:min(680px,100% - 24px);max-height:min(88vh,100% - 24px);padding:0;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);color:var(--ink);overflow:auto;box-shadow:0 50px 120px -30px rgba(0,0,0,.5)}
dialog[open]{animation:pop .4s var(--ease)}
dialog::backdrop{background:rgba(10,12,20,.5);backdrop-filter:blur(6px);animation:fade-b .3s}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes fade-b{from{opacity:0}}
.d-close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);color:#14161d;
  display:grid;place-items:center;font-size:20px;z-index:2}
.d-body{padding:24px 28px 30px;display:grid;gap:14px}
.d-body h3{font-size:26px;letter-spacing:-.02em;line-height:1.3}
.d-body .lead{color:var(--ink-2)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.meta div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 14px;font-size:13px}
.meta dt{color:var(--ink-2);font-size:12px}
.meta dd{margin:0;font-weight:700}

/* ============ プロフィール ============ */
.about{display:grid;gap:18px;grid-template-columns:1.4fr 1fr}
@media (max-width:760px){.about{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(22px,4vw,36px)}
.me{display:flex;gap:16px;align-items:center;margin-bottom:18px}
/* ▼ 作者アイコンの調整はここだけ変えればOK ▼
   --av-size : アイコンの大きさ(例: 72px → 96px)
   --av-zoom : 画像の拡大率(大きいほど顔がアップ)
   --av-x / --av-y : 画像のどこを中心に表示するか(0〜1, 顔の中心=0.515 / 0.42) */
.avatar{--av-size:84px;--av-zoom:1.7;--av-x:.515;--av-y:.42;
  width:var(--av-size);height:var(--av-size);border-radius:50%;position:relative;overflow:hidden;flex:none;
  background:var(--surface-2);box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line),0 10px 24px -12px var(--accent)}
.avatar img{position:absolute;max-width:none;width:calc(var(--av-zoom)*100%);height:auto;
  left:calc(50% - var(--av-x)*var(--av-zoom)*100%);top:calc(50% - var(--av-y)*var(--av-zoom)*75%);
  image-rendering:pixelated;user-select:none;-webkit-user-drag:none}
.panel p+p{margin-top:12px}
.panel p{color:var(--ink-2)}
.links{display:grid;gap:8px;margin-top:6px}
.links a{display:flex;justify-content:space-between;padding:14px 16px;border-radius:var(--r-sm);background:var(--surface-2);font-weight:600;transition:transform .25s var(--ease),background .2s}
.links a:hover{transform:translateX(4px);background:var(--glow)}
footer{padding-block:40px;color:var(--ink-2);font-size:13px;text-align:center}

/* アニメーション抑制 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .hero h1 span i{transform:none}.hero p,.hero .cta{opacity:1}
}

/* ============ 2026 UX アップグレード ============ */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.progress{position:fixed;inset:0 0 auto 0;height:3px;z-index:60;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--accent),#22d3ee,#f472b6);pointer-events:none}
@supports (animation-timeline:scroll()){
  .progress{animation:prog linear both;animation-timeline:scroll(root)}
  @keyframes prog{to{transform:scaleX(1)}}
}
@supports (animation-timeline:view()){
  .card,.panel,.head{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 50%}
  @keyframes reveal{from{opacity:0;translate:0 44px;filter:blur(8px)}to{opacity:1;translate:0 0;filter:blur(0)}}
}
.hero h1 span:nth-child(3) i{background:linear-gradient(100deg,var(--ink-2),var(--accent),#22d3ee,#f472b6,var(--ink-2));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .9s var(--ease) .24s forwards,shine 7s linear 1s infinite}
@keyframes shine{to{background-position:-300% 0}}
.btn{will-change:transform}
/* アバター: 回るリング+傾き */
.av-ring{padding:3px;border-radius:50%;flex:none;transform:perspective(500px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));
  background:conic-gradient(from var(--ang),var(--accent),#22d3ee,#f472b6,var(--accent));animation:spin 6s linear infinite;
  transition:transform .25s var(--ease)}
@keyframes spin{to{--ang:360deg}}
.av-ring .avatar{box-shadow:0 0 0 3px var(--surface)}
/* コマンドパレット */
.kbd{width:auto!important;padding:0 12px!important;font-size:12px;letter-spacing:.02em;border:1px solid var(--line)}
#pal{margin:12vh auto auto;width:min(560px,100% - 28px);padding:0;border:1px solid var(--line);border-radius:var(--r-lg);
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  color:var(--ink);box-shadow:0 40px 90px -30px rgba(0,0,0,.5);overflow:hidden}
#pal::backdrop{background:rgba(10,12,20,.4);backdrop-filter:blur(3px)}
#pal[open]{animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.97)}}
#pq{width:100%;padding:20px 22px;font:inherit;font-size:17px;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);outline:0}
#pl{list-style:none;padding:8px;max-height:50vh;overflow:auto}
#pl li{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600}
#pl li small{color:var(--ink-2);font-weight:500}
#pl li[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
#pl li[aria-selected="true"] small{color:inherit;opacity:.8}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card,.panel,.head{opacity:1!important;translate:none!important;filter:none!important}
}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"></div>

<header>
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#top">Shota Games</a>
      <nav aria-label="メイン">
        <a href="#games">ゲーム</a>
        <a class="hide-s" href="#about">作者について</a>
        <a class="hide-s" href="#contact">連絡先</a>
        <button class="icon-btn kbd" id="cmdk" aria-label="コマンドパレットを開く" title="検索 (Ctrl/⌘ + K)">⌘K</button>
        <button class="icon-btn" id="theme" aria-label="テーマを切り替え" title="テーマを切り替え">◐</button>
      </nav>

ACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooABX0v+xfbQ3PjTVRNDHKAON6hsfnRRWVf+Gxrc+5IgFuJUUAIG+6OlaTDCtj+6f5UUV4kzppniXiOaT7e48xsbjxms1eRk0UV4FX4mfo2F/hRG0UUVmdAUUUUAFFFFABRRRQA5QD1pjuyH5WK/Q4oooE9j1rwE7PowLMWPuc10F98sDEcH1FFFe7h/gifn+P8A48/U8q+OFtDL8MdUkkhjeQLwzKCR+NfmgfvP/vGiivbwnws8qQlFFFdZIUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQB//Z",   // ゲーム2のサムネイル
};

const GAMES = [
  { id:"game-one",   title:"Matr◯x風RPG(デモ)", tagline:"移動して会話するだけのデモ",
    description:"あの映画の世界観を体験できるけど、ほんの少しだけ。(初めて作ったゲーム)",
    tags:["RPG","スマホ"], year:2026, genre:"RPG", platform:"PC / スマホ", status:"公開中",
    url:"https://heisei-retro-rpg.shota-maeda13.workers.dev/", icon:"", thumb:IMG.rpg, pixel:true, hue:235, emoji:"🧩" },
  { id:"game-two",   title:"おならカーリング", tagline:"おならでカーリング",
    description:"世界一くだらないゲーム。友だちと対戦してみよう!",
    tags:["アクション","スマホ"], year:2026, genre:"アクション", platform:"スマホ", status:"公開中",
    url:"https://onara-curling.pages.dev/", icon:"", thumb:IMG.fart, hue:330, emoji:"⚡" },
];

/* ============ 描画 ============ */
const $ = s => document.querySelector(s);
const grid = $("#grid"), dlg = $("#dlg");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thumbHTML = g => `<div class="thumb" style="--h:${g.hue ?? 240}">${
  g.thumb ? `<img src="${esc(g.thumb)}" alt="" loading="lazy" decoding="async"${g.pixel?' style="image-rendering:pixelated"':''}>` : `<b aria-hidden="true">${esc(g.title.slice(0,1))}</b>`}</div>`;
const iconHTML = g => `<div class="icon" style="--h:${g.hue ?? 240}"><img src="${esc(g.icon || IMG.icon)}" alt="" loading="lazy"></div>`;

function renderCards(){
  grid.innerHTML = GAMES.map(g => `
    <button class="card" data-id="${esc(g.id)}" data-tags="${esc(g.tags.join("|"))}" aria-label="${esc(g.title)}の詳細を開く">
      ${thumbHTML(g).replace('</div>', `<span class="badge">${esc(g.status)}</span></div>`)}
      <div class="body">
        <div class="title-row">${iconHTML(g)}<h3>${esc(g.title)}</h3></div>
        <p>${esc(g.tagline)}</p>
        <div class="tags">${g.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      </div>
    </button>`).join("") + `<div class="soon">次のゲームを準備中です。<br>更新をお楽しみに。</div>`;
  $("#count").textContent = `${GAMES.length}本のゲームを公開中。タップで詳細、そのまま遊べます。`;
}

let activeTag = "すべて";
function renderFilters(){
  const tags = ["すべて", ...new Set(GAMES.flatMap(g => g.tags))];
  $("#filters").innerHTML = tags.map(t => `<button class="chip" aria-pressed="${t===activeTag}">${esc(t)}</button>`).join("");
}
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  activeTag = b.textContent; renderFilters();
  grid.querySelectorAll(".card").forEach(c => c.hidden = !(activeTag==="すべて" || c.dataset.tags.split("|").includes(activeTag)));
  const soon = grid.querySelector(".soon"); if(soon) soon.hidden = activeTag!=="すべて";
});

/* カード: カーソルに合わせて光と傾き(マウス操作時のみ) */
grid.addEventListener("pointermove", e => {
  if(e.pointerType !== "mouse") return;
  const c = e.target.closest(".card"); if(!c) return;
  const r = c.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
  c.style.setProperty("--mx", x*100+"%"); c.style.setProperty("--my", y*100+"%");
  c.style.setProperty("--ry", (x-.5)*6+"deg"); c.style.setProperty("--rx", (.5-y)*6+"deg");
});
grid.addEventListener("pointerout", e => {
  const c = e.target.closest(".card"); if(c){ c.style.setProperty("--rx","0deg"); c.style.setProperty("--ry","0deg"); }
});

/* 詳細ダイアログ */
function openGame(id, push=true){
  const g = GAMES.find(x => x.id === id); if(!g) return;
  $("#d-content").innerHTML = `
    ${thumbHTML(g)}
    <div class="d-body">
      <div class="title-row">${iconHTML(g)}<h3 id="d-title">${esc(g.title)}</h3></div>
      <p class="lead">${esc(g.tagline)}</p>
      <p>${esc(g.description)}</p>
      <dl class="meta">
        <div><dt>ジャンル</dt><dd>${esc(g.genre)}</dd></div>
        <div><dt>対応</dt><dd>${esc(g.platform)}</dd></div>
        <div><dt>公開年</dt><dd>${esc(g.year)}</dd></div>
      </dl>
      <div class="tags">${g.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      <div><a class="btn primary" href="${esc(g.url)}" target="_blank" rel="noopener">今すぐ遊ぶ</a></div>
    </div>`;
  if(!dlg.open) dlg.showModal();
  if(push) history.replaceState(null, "", "#"+id);
}
function closeGame(){ if(dlg.open) dlg.close(); }
grid.addEventListener("click", e => { const c = e.target.closest(".card"); if(c) openGame(c.dataset.id); });
$("#d-close").addEventListener("click", closeGame);
dlg.addEventListener("click", e => { if(e.target === dlg) closeGame(); });
dlg.addEventListener("close", () => { if(GAMES.some(g => "#"+g.id === location.hash)) history.replaceState(null,"",location.pathname+location.search); });
addEventListener("hashchange", () => { const id = location.hash.slice(1); GAMES.some(g=>g.id===id) ? openGame(id,false) : closeGame(); });

/* テーマ切り替え(OS設定に追従+手動で上書き) */
const root = document.documentElement;
try{ const t = localStorage.getItem("theme"); if(t) root.dataset.theme = t; }catch(e){}
function toggleTheme(){
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  const next = dark ? "light" : "dark";
  const apply = () => { root.dataset.theme = next; try{ localStorage.setItem("theme", next); }catch(e){} };
  if(!document.startViewTransition || matchMedia("(prefers-reduced-motion:reduce)").matches){ apply(); return; }
  const r = $("#theme").getBoundingClientRect(), x = r.left+r.width/2, y = r.top+r.height/2;
  const rad = Math.hypot(Math.max(x,innerWidth-x), Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(() => root.animate(
    { clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`] },
    { duration:650, easing:"cubic-bezier(.2,.8,.2,1)", pseudoElement:"::view-transition-new(root)" }));
}
$("#theme").addEventListener("click", toggleTheme);

/* 背景のにじみ */
const aura = $(".aura");
addEventListener("pointermove", e => { if(e.pointerType==="mouse"){ aura.style.setProperty("--ax", e.clientX+"px"); aura.style.setProperty("--ay", e.clientY+"px"); } }, {passive:true});

/* リンク・フッター */
$("#links").innerHTML = SITE.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label)}</span><span aria-hidden="true">↗</span></a>`).join("");
$("#year").textContent = new Date().getFullYear();

/* ===== 2026 UX: コマンドパレット / 傾き / マグネット ===== */
const pal=$("#pal"), pq=$("#pq"), pl=$("#pl"); let sel=0, items=[];
const ACTIONS=[
  {t:"ゲーム一覧へ",s:"移動",run:()=>location.hash="#games"},
  {t:"作者について",s:"移動",run:()=>location.hash="#about"},
  {t:"リンク・連絡先",s:"移動",run:()=>location.hash="#contact"},
  {t:"テーマを切り替え",s:"操作",run:toggleTheme},
  ...GAMES.map(g=>({t:g.title,s:g.genre,run:()=>openGame(g.id)})),
];
function drawPal(){
  const q=pq.value.trim().toLowerCase();
  items=ACTIONS.filter(a=>(a.t+a.s).toLowerCase().includes(q)); sel=Math.min(sel,Math.max(items.length-1,0));
  pl.innerHTML=items.map((a,i)=>`<li role="option" data-i="${i}" aria-selected="${i===sel}"><span>${esc(a.t)}</span><small>${esc(a.s)}</small></li>`).join("")||`<li><small>見つかりません</small></li>`;
}
function openPal(){ pq.value=""; sel=0; drawPal(); if(!pal.open) pal.showModal(); pq.focus(); }
function runPal(i){ const a=items[i]; if(!a) return; pal.close(); setTimeout(a.run,60); }
$("#cmdk").addEventListener("click",openPal);
pq.addEventListener("input",()=>{sel=0;drawPal();});
pl.addEventListener("click",e=>{const li=e.target.closest("li[data-i]"); if(li) runPal(+li.dataset.i);});
pal.addEventListener("click",e=>{if(e.target===pal) pal.close();});
pal.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); sel=(sel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length; drawPal(); pl.children[sel]?.scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"){ e.preventDefault(); runPal(sel); }
});
addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); pal.open?pal.close():openPal(); } });

/* アイコンがマウスに合わせて傾く */
const ring=$(".av-ring");
if(ring && matchMedia("(hover:hover)").matches){
  ring.addEventListener("pointermove",e=>{ const r=ring.getBoundingClientRect();
    ring.style.setProperty("--ty",((e.clientX-r.left)/r.width-.5)*28+"deg");
    ring.style.setProperty("--tx",((e.clientY-r.top)/r.height-.5)*-28+"deg"); });
  ring.addEventListener("pointerleave",()=>{ring.style.setProperty("--tx","0deg");ring.style.setProperty("--ty","0deg");});
}
/* ボタンがカーソルに吸い付く */
if(matchMedia("(hover:hover)").matches) document.querySelectorAll(".btn").forEach(b=>{
  b.addEventListener("pointermove",e=>{ const r=b.getBoundingClientRect();
    b.style.translate=`${(e.clientX-r.left-r.width/2)*.18}px ${(e.clientY-r.top-r.height/2)*.28}px`; });
  b.addEventListener("pointerleave",()=>b.style.translate="");
});

renderCards(); renderFilters();
if(GAMES.some(g => g.id === location.hash.slice(1))) openGame(location.hash.slice(1), false);
</script>
</body>
</html>
